<!DOCTYPE html>
<html>
<head>
    <title>Account Management | STREAMAX</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='home.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet">
</head>
<body>
    <div class="container-fluid min-vh-100 px-4 px-lg-5 py-4">
        {% include '_header.html' %}

        <div class='account-form w-100 mx-auto mt-5' style='max-width: 500px;'>
            <h2 class='mb-4 text-center'>Account Management</h2>
       
            {% if session.name %}
                <div class='account-details mb-2'>
                    <div class='account-row'>
                        <span class='material-symbols-outlined'>person</span>
                        <span class='account-value'>{{ session.name }}</span>
                    </div>

                    <div class='account-row'>
                        <span class='material-symbols-outlined'>mail</span>
                        <span class='account-value'>{{ session.email }}</span>
                    </div>
                </div>
            {% endif %}
            
            <div class="col-5 mx-auto text-center">
                <a href="/namechange" class='btn home-button mt-3 w-100'>Change Name</a>
                <a href="/pwdchange" class='btn home-button mt-3 w-100'>Change Password</a>
            </div>

        </div>
    </div>
    
</body>
</html>
