<!DOCTYPE html>
<html>
<head>
    <title>Account Management | STREAMAX</title>
    {% include '_base_head.html' %}
</head>
<body>
    <div class="container-fluid min-vh-100 px-4 px-lg-5 py-4">
        {% include '_header.html' %}

        <div class='account-form w-100 mx-auto mt-5' style='max-width: 500px;'>
            <h2 class='mb-4 text-center'>Account Management</h2>
       
            {% if session.name %}
                <div class='account-details mb-2'>
                    <div class='account-row'>
                        <span class='material-symbols-outlined'>person</span>
                        <span class='account-value'>{{ session.name }}</span>
                    </div>

                    <div class='account-row'>
                        <span class='material-symbols-outlined'>mail</span>
                        <span class='account-value'>{{ session.email }}</span>
                    </div>

                    <div class='account-row'>
                        <span class='material-symbols-outlined'>badge</span>
                        <span class='account-value'>{{ session.account_type }}</span>
                    </div>
                </div>
            {% endif %}
            
            <div class="col-12 col-sm-8 col-md-6 mx-auto text-center">
                <a href="{{url_for('change_name')}}" class='btn home-button mt-3 w-100'>Change Name</a>
                <a href="{{url_for('change_password')}}" class='btn home-button mt-3 w-100'>Change Password</a>
            </div>

        </div>
    </div>
    
</body>
</html>
