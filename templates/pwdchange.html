<!DOCTYPE html>
<html>
<head>
    <title>Change Password | STREAMAX</title>
    {% include '_base_head.html' %}
</head>
<body>
    <div class="container-fluid min-vh-100 d-flex flex-column px-4 px-lg-5 py-4">
        {% include '_header.html' %}

        {% with messages = get_flashed_messages() %}
            {% if messages %}
                <div class='toast-container position-fixed top-0 end-0 p-3'>
                    <div id='changeToast' class='toast streamax-toast' role='alert'>
                        <div class='toast-body'>
                            <span class='toast-icon'>✓</span>{{messages[0]}}
                        </div>
                    </div>
                </div>
            {% endif %}
        {% endwith %}
        
        <div class='card-design w-100 mx-auto my-auto' style='max-width: 500px;'>
            <h2 class='mb-4 text-center'>Change Password</h2>
                {% if message %}
                    <div class="form-message mb-4" role='alert'>
                        <span class='material-symbols-outlined'>error</span>
                        <span>{{message}}</span>
                    </div>
                {% endif %}

            <form method="POST" class='account-form'>
                <div class='mb-4 w-100'>
                    <label for='password' class='form-label'>Current Password</label>
                    <input type="password" class='form-control' id='password'  name="password"
                        placeholder="Enter your password" required>
                </div>

                <div class='mb-4 w-100'>
                    <label for='newpassword' class='form-label'>New password</label>
                    <input type="password" class='form-control' id='newpassword' name="newpassword"
                        placeholder="Enter your new password" required>
                </div>

                <div class='mb-4 w-100'>
                    <label for='newpassword2' class='form-label'>Confirm New Password</label>
                    <input type="password" class='form-control' id='newpassword2' name="newpassword2"
                        placeholder="Confirm your new password" required>
                </div>

                    <button type="submit" class='btn btn-primary w-100'>Save Changes</button>
            </form>

            <div class='text-center mt-4'>
                <a href="{{url_for('account_management')}}" class='back-home'>Back to Account Management</a>
            </div>
        </div>
    </div>

    <script>
        const toastElem = document.getElementById('changeToast');
        if (toastElem) {
            const toast = new bootstrap.Toast(toastElem, {delay:2000});
            toast.show();
        }
    </script>
</body>
</html>
