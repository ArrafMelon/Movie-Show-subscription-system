<header class="header">
    <div>
        <a href="/" class="brandlink">
            <img src="{{ url_for('static', filename='images/streamax-logo.png')}}"
                alt="STREAMAX logo" class="logo">
            <h1 class="brandname">STREAMA<span class="brand-x">X</span></h1>
        </a>
        <div class="tagline">Sit Back. Stream More.</div>
    </div>
            
    <nav class="nav">
        {% if session.name %}
            <a href="/search_media">Explore</a>

            {% if session.account_type =="User"%}
                <a href="{{url_for('my_watchlist')}}">My Watchlist</a>
                <a href="{{url_for('user_dashboard')}}">Dashboard</a>
                <a href="{{url_for('subscription_plan')}}">Subscription Plans</a>
                <a href="{{url_for('contact_support')}}">Contact Support</a>
            {% endif %}

            {% if session.account_type =="Admin"%}
                <a href="{{url_for('add_media')}}">Add Media</a>
                <a href="{{url_for('admin_dashboard')}}">Admin Dashboard</a>
            {% endif %}
                        
            <a href="{{url_for('account_management')}}">Account</a>
            <a href="{{url_for('logout')}}">Logout</a>
        {% else %}
            <a href="{{url_for('login')}}">Login</a>
            <a href="{{url_for('register')}}">Register</a>
        {% endif %}
    </nav>
</header>
