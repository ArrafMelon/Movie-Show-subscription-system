<!DOCTYPE html>
<html>
<head>
    <title>Subscription Plans | STREAMAX</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='home.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>
    <div class="container-fluid min-vh-100 d-flex flex-column px-4 px-lg-5 py-4">
        {% include '_header.html' %}

        {% if request.args.get('updated')=='1' %}
            <div class='toast-container position-fixed top-0 end-0 p-3'>
                <div id='changeToast' class='toast streamax-toast' role='alert'>
                    <div class='toast-body'>
                        <span class='toast-icon'>✓</span>Plan updated successfully.
                    </div>
                </div>
            </div>
        {% endif %}

        <div class='card-design w-100 mx-auto my-auto' style='max-width: 500px;'>
            <h2 class='mb-4 text-center'>Choose a Plan</h2>
            <p class='text-center form-message'>{{ message }}</p>

            <form method="POST" action="/subscription_plan_user" class='account-form'>
                <div class='mb-4 w-100'>
                    <label for='subscription_type' class='form-label'>Plan</label>
                    <select class='form-select' id='subscription_type' name="subscription_type">
                        <option value="1" {% if session.subscription_type == 1 %}selected{% endif %}>Individual</option>
                        <option value="2" {% if session.subscription_type == 2 %}selected{% endif %}>Family</option>
                    </select>
                </div>

                <div class='mb-4 p-3 rounded-3 text-center' style='background: rgba(255, 255, 255, 0.08); border: 1px solid rgba(255, 255, 255, 0.15);'>
                    <h5 class='mb-2'>Enter card information here</h5>
                    
                    <input type='text' class='form-control mb-2' name='card_number' placeholder='Card number'>
                    <input type='text' class='form-control mb-2' name='expiry' placeholder='MM/YY'>
                    <input type='password' class='form-control' name='cvv' placeholder='CVV'>

                </div>

                <button type="submit" class='btn btn-primary w-100'>Save Plan</button>
            </form>

            <div class='text-center mt-4'>
                <a href="/" class='back-home'>Back to Home</a>
            </div>
        </div>
    </div>

    <script>
        const toastElem = document.getElementById('changeToast');
        if (toastElem) {
            const toast = new bootstrap.Toast(toastElem, {delay:2000});
            toast.show();
        }
    </script>
</body>
</html>
