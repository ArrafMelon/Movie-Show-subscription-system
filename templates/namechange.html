<!DOCTYPE html>
<html>
<head>
    <title>Change Name | STREAMAX</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='home.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>
    <div class="container-fluid min-vh-100 d-flex flex-column px-4 px-lg-5 py-4">
        {% include '_header.html' %}
        {% with messages = get_flashed_messages() %}
            {% if messages %}
                <div class='toast-container position-fixed top-0 end-0 p-3'>
                    <div id='changeToast' class='toast streamax-toast' role='alert'>
                        <div class='toast-body'>
                            <span class='toast-icon'>✓</span>{{messages[0]}}
                        </div>
                    </div>
                </div>
            {% endif %}
        {% endwith %}
        

        <div class='card-design w-100 mx-auto my-auto' style='max-width: 500px;'>
            <h2 class='mb-4 text-center'>Change Name</h2>
            <p class='text-center form-message'>{{ message }}</p>

            <form method="POST" class='account-form'>
                <div class='mb-4 w-100'>
                    <label for='newname' class='form-label'>New name</label>
                    <input type="text" class='form-control' id='newname' name="newname"
                        placeholder="Enter your new name" required>
                </div>

                <div class='mb-4 w-100'>
                    <label for='newname2' class='form-label'>Confirm new name</label>
                    <input type="text" class='form-control' id='newname2' name="newname2"
                        placeholder="Confirm your new name" required>
                </div>

                <button type="submit" class='btn btn-primary w-100'>Save Changes</button>
            </form>

            <div class='text-center mt-4'>
                <a href="/accmgmt" class='back-home'>Back to Account Management</a>
            </div>
        </div>
    </div>

    <script>
        const toastElem = document.getElementById('changeToast');
        if (toastElem) {
            const toast = new bootstrap.Toast(toastElem, {delay:2000});
            toast.show();
        }
    </script>
</body>
</html>
