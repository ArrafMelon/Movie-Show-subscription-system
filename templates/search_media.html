<!DOCTYPE html>
<html>
<head>
    <title>Search for Movies or Shows</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='home.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
</head>
<body>
    <div class = "page-content">
    <h1>Search Media</h1>
    
    <form method="GET" style="flex-direction: row; justify-content: center;">

    <div class="topnav">
    <input type="text" name="search" placeholder="Search..">
    </div>

        <select name="genre">
            <option value="">Show all</option>
            <option value="Action">Action</option>
            <option value="Comedy">Comedy</option>
            <option value="Horror">Horror</option>
            <option value="Sci-fi">Sci-fi</option>
            <option value="Romance">Romance</option>
            <option value="Mature">Mature</option>
        </select><br><br>

        <select name="media_type">
            <option value="">Show all</option>
            <option value="Show">Show</option>
            <option value="Movie">Movie</option>
        </select><br><br>

        <button type="submit">Apply Filters</button>
    </form>

    <style>
        .bounding-box {
            border: 2px solid #a56de4;
            padding: 10px;
        }
    </style>
   {% for media in all_media %}
        <div class="bounding-box">
        <img src="{{ url_for('static',filename='images/' + media[4])}}", width="225">
        <br>
        {{ "Name: " + media[1] }}<br>
        {{ "Description: " + media[2] }}<br>
        {{ "Media Type: " + media[3] }}<br>
        {{ "Genre: " + media[5] }}<br><br>
        </div>
   {% else %}
        <p>No Media Available yet</p>
   {% endfor %}

    <a href="/">Back to Home</a>
    </div>
</body>
</html>
