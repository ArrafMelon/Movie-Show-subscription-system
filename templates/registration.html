<!DOCTYPE html>
<html>
<head>
    <title>Register | STREAMAX</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='home.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</head>

<body>
    {% with messages = get_flashed_messages() %}
        {% if messages %}
            <div class='toast-container position-fixed top-0 end-0 p-3'>
                <div id='registerToast' class='toast streamax-toast' role='alert'>
                    <div class='toast-body'>
                        <span class='toast-icon'>✓</span>{{messages[0]}}
                    </div>
                </div>
            </div>
        {% endif %}
    {% endwith %}

    <div class = "container min-vh-100 d-flex justify-content-center align-items-center py-5">
        <div class="card-design w-100" style='max-width: 450px;'>

            <div class='text-center mb-4'>
                <a href="/" class='brandlink'>
                    <img src="{{ url_for('static', filename='images/streamax-logo.png')}}"
                        alt="STREAMAX logo" class="logo">
                    <h1 class="brandname">STREAMA<span class="brand-x">X</span></h1>
                </a>
           
                <h2 class='mt-3'>Create an Account</h2>
            </div> 
            {% if message %}
                <p class="text-center form-message">{{ message }}</p>
            {% endif%}

            <form method="POST">
                <div class="mb-3 w-100">
                    <label for='name' class='form-label'>Name</label>
                    <input type="text" class='form-control' id='name' name="name"
                        placeholder="Enter your name">
                </div>

                <div class="mb-3 w-100">
                    <label for='email' class='form-label'>Email</label>
                    <input type="email" class='form-control' id='email' name="email"
                        placeholder="Enter your email address">
                </div>

                <div class="mb-3 w-100">
                    <label for='password' class='form-label'>Password</label>
                    <input type="password" class='form-control' id='password' name="password"
                        placeholder="Enter your password">  
                </div>

                <div class="mb-3 w-100">   
                    <label for='account_type' class='form-label'>Account type</label>
                    <select class='form-control' id='account_type' name="account_type">
                        <option value="User">User</option>
                        <option value="Admin">Admin</option>
                    </select>
                </div>
  
                    <button type="submit" class="btn btn-primary w-100">Register</button>
            </form>
 
            <div class='text-center mt-4 login-footer'>
                <p>Already have an account? <a href="/login">Sign in</a></p>
                <a href="/" class="back-home">Back to Home</a>
            </div>
        </div>
    </div>

    <script>
        const toastElem = document.getElementById('registerToast');
        if (toastElem) {
            const toast = new bootstrap.Toast(toastElem, {delay:2000});
            toast.show();
        }
    </script>

</body>
</html>
