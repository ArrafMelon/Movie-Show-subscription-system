<!DOCTYPE html>
<html>
<head>
    <title>Login | STREAMAX</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='home.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</head>

<body>
    <div class = "container min-vh-100 d-flex justify-content-center align-items-center py-5">
        <div class="card-design w-100" style='max-width: 450px;'>
            <div class='text-center mb-4'>
                <a href="/" class='brandlink'>
                    <img src="{{ url_for('static', filename='images/streamax-logo.png')}}"
                        alt="STREAMAX logo" class="logo">
                    <h1 class="brandname">STREAMA<span class="brand-x">X</span></h1>
                </a>
                
                <h2 class='mt-3'>Welcome back!</h2>
            </div>

            {% with messages = get_flashed_messages() %}
                {% if message or messages %}
                    <div class='toast-container position-fixed top-0 end-0 p-3'>
                        <div id='msgToast' class='toast streamax-toast' role='alert'>
                            <div class='toast-body'>
                                <span class='toast-icon'>✓</span>
                                {%if message %} {{message}}
                                {% else%} {{messages[0]}}
                                {% endif %}
                            </div>
                        </div>
                    </div>
                {% endif %}
            {% endwith %}

            <form method="POST">   
                <div class="mb-3 w-100">     
                    <label for='email' class='form-label'>Email</label>
                    <input type="email" class='form-control' id='email' name="email"
                        placeholder="Enter your email" required>
                </div>

                <div class="mb-4 w-100">
                    <label for='password' class='form-label'>Password</label>
                    <input type="password" class='form-control' id='password' name="password"
                        placeholder="Enter your password" required>
                </div>

                <button type="submit" class='btn btn-primary w-100'>Login</button>
            </form>

            <div class='text-center mt-4 login-footer'>
                <p>Don't have an account? <a href='/register'>Create one!</a></p>
                <a href="/" class="back-home">Back to Home</a>
            </div>
        </div>
    </div>

    <script>
        const toastElem = document.getElementById('msgToast');

        if (toastElem) {
            const toast = new bootstrap.Toast(toastElem, { delay: 2000 });
            toast.show();
        }
    </script>

</body>
</html>
