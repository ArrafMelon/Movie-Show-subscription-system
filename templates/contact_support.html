<!DOCTYPE html>
<html>
<head>
    <title>Contact Support | STREAMAX</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='home.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>
    <div class="container-fluid min-vh-100 d-flex flex-column px-4 px-lg-5 py-4">
        {% include '_header.html' %}

        <div class='card-design w-100 mx-auto my-auto' style='max-width: 500px;'>
            <h2 class='mb-4 text-center'>Contact Support</h2>
            <p class='text-center form-message'>{{ message }}</p>

            <form method="POST" action="/user_support" class='account-form'>
                <div class='mb-4 w-100'>
                    <label for='user_support' class='form-label'>How can we help?</label>
                    <textarea class='form-control' id='user_complaint' name='user_complaint' rows='5'
                        placeholder='Describe your complaint' required></textarea>
                </div>

                <button type="submit" class='btn btn-primary w-100'>Submit</button>
            </form>
            <div class='text-center mt-4'>
                <a href="/" class='back-home'>Back to Home</a>
            </div>
        </div>
    </div>

    <script>
        const toastElem = document.getElementById('changeToast');
        if (toastElem) {
            const toast = new bootstrap.Toast(toastElem, {delay:2000});
            toast.show();
        }
    </script>
</body>
</html>
