<!DOCTYPE html>
<html>
<head>
    <title>Contact Support | STREAMAX</title>
    {% include '_base_head.html' %}
</head>
<body>
    <div class="container-fluid min-vh-100 d-flex flex-column px-4 px-lg-5 py-4">
        {% include '_header.html' %}

        {% with messages = get_flashed_messages() %}
                {% if messages %}
                    <div class='toast-container position-fixed top-0 end-0 p-3'>
                        <div id='complainToast' class='toast streamax-toast' role='alert'>
                            <div class='toast-body'>
                                <span class='toast-icon'>✓</span>{{messages[0]}}
                            </div>
                        </div>
                    </div>
                {% endif %}
            {% endwith %}

            <div class='card-design w-100 mx-auto mt-5 mb-4 p-4' style='max-width: 500px;'>
            <h2 class='mb-4 text-center'>Contact Support</h2>

            <form method="POST" action="{{ url_for('contact_support')}}" class='account-form'>
                <div class='mb-4 w-100'>
                    <label for='user_complaint' class='form-label'>How can we help?</label>
                    <textarea class='form-control' id='user_complaint' name='user_complaint' rows='5'
                        placeholder='Please describe how we can help...' required></textarea>
                </div>

                <button type="submit" class='btn btn-primary w-100'>Submit Request</button>
            </form>
            <div class='text-center mt-4'>
                <a href="/" class='back-home'>Back to Home</a>
            </div>
        </div>
    </div>

    <script>
        const toastElem = document.getElementById('complainToast');
        if (toastElem) {
            const toast = new bootstrap.Toast(toastElem, {delay:2000});
            toast.show();
        }
    </script>
</body>
</html>
